<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yarım Asır kare</title>
<link rel="stylesheet" href="../font/fontsource-cormorant-garamond-5.3.0/package/300.css">
<link rel="stylesheet" href="../font/fontsource-cormorant-garamond-5.3.0/package/400-italic.css">
<link rel="stylesheet" href="../font/fontsource-cormorant-garamond-5.3.0/package/300-italic.css">
<link rel="stylesheet" href="../font/inter/package/400.css">
<link rel="stylesheet" href="../font/inter/package/500.css">
<link rel="stylesheet" href="../font/inter/package/600.css">
<style>
  :root { --gold: #d6c29a; --ink: #0b0907; --paper: rgba(255,250,240,.94); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: var(--ink); overflow: hidden; }
  .frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .archive { filter: grayscale(1) sepia(.22) contrast(1.12) brightness(.78); }
  .shade { position: absolute; inset: 0; }
  .grain { position: absolute; inset: -50%; width: 200%; height: 200%; opacity: .16; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .serif { font-family: 'Cormorant Garamond', serif; }
  .sans { font-family: 'Inter', sans-serif; }
  .label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: .42em; color: var(--gold); text-transform: uppercase; }
  .rule { display: inline-block; width: 56px; height: 1px; background: var(--gold); vertical-align: middle; margin-right: 22px; }
  .safe-guide { display: none; }

  /* 1: açılış */
  #f1 .img { object-position: 62% 50%; transform: scale(1.06); }
  #f1 .shade { background: radial-gradient(120% 70% at 50% 45%, rgba(11,9,7,.15) 0%, rgba(11,9,7,.78) 70%, rgba(11,9,7,.95) 100%); }
  #f1 .title { position: absolute; left: 0; right: 0; top: 820px; text-align: center; }
  #f1 h1 { font-weight: 300; font-size: 196px; line-height: 1; letter-spacing: -.01em; color: var(--paper); }
  #f1 .sub { margin-top: 40px; font-family: 'Inter'; font-weight: 500; font-size: 22px; letter-spacing: .46em; color: rgba(255,250,240,.62); }

  /* 2: anlatım + yer */
  #f2 .img { object-position: 30% 50%; }
  #f2 .shade { background: linear-gradient(180deg, rgba(11,9,7,.55) 0%, rgba(11,9,7,0) 22%, rgba(11,9,7,0) 52%, rgba(11,9,7,.88) 82%, rgba(11,9,7,.95) 100%); }
  #f2 .place { position: absolute; left: 90px; top: 270px; }
  #f2 .cap { position: absolute; left: 90px; right: 110px; top: 1300px; font-family: 'Inter'; font-weight: 500; font-size: 50px; line-height: 1.32; letter-spacing: -.005em; color: rgba(255,250,240,.38); }
  #f2 .cap b { font-weight: 500; color: var(--paper); }

  /* 3: alıntı */
  #f3 .img { object-position: 46% 50%; filter: contrast(1.05) saturate(.92) brightness(.92); }
  #f3 .shade { background: linear-gradient(180deg, rgba(11,9,7,.35) 0%, rgba(11,9,7,0) 18%, rgba(11,9,7,0) 42%, rgba(11,9,7,.82) 66%, rgba(11,9,7,.96) 100%); }
  #f3 .quote { position: absolute; left: 90px; right: 90px; top: 1150px; }
  #f3 .quote p { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 400; font-size: 82px; line-height: 1.08; color: var(--paper); }
  #f3 .quote p span { color: rgba(255,250,240,.4); }
  #f3 .who { margin-top: 48px; }

  /* 4: kapanış */
  #f4 .img { object-position: 35% 50%; filter: grayscale(1) sepia(.2) contrast(1.05) brightness(.32) blur(1.5px); transform: scale(1.08); }
  #f4 .shade { background: radial-gradient(90% 55% at 50% 48%, rgba(11,9,7,.35), rgba(11,9,7,.92)); }
  #f4 .title { position: absolute; left: 0; right: 0; top: 760px; text-align: center; }
  #f4 h1 { font-weight: 300; font-size: 168px; line-height: 1; color: var(--paper); }
  #f4 .bar { width: 72px; height: 1px; background: var(--gold); margin: 56px auto 44px; }
  #f4 .ep { font-family: 'Inter'; font-weight: 500; font-size: 24px; letter-spacing: .6em; color: var(--gold); padding-left: .6em; }
  #f4 .next { margin-top: 64px; font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300; font-size: 44px; color: rgba(255,250,240,.6); }
</style>
</head>
<body>
<div class="frame" id="f1" hidden>
  <img class="img archive" src="up/kapi.png">
  <div class="shade"></div><div class="grain"></div>
  <div class="title"><h1 class="serif">Yarım asır.</h1><div class="sub">BİR GÖZLÜKÇÜNÜN HİKÂYESİ</div></div>
</div>

<div class="frame" id="f2" hidden>
  <img class="img archive" src="up/muayene.png">
  <div class="shade"></div><div class="grain"></div>
  <div class="place label"><span class="rule"></span>Aksaray</div>
  <div class="cap"><b>Gözler ölçüldü, camlar kesildi,</b> her çerçeve bir yüze göre ayarlandı.</div>
</div>

<div class="frame" id="f3" hidden>
  <img class="img" src="up/bugun.png">
  <div class="shade"></div><div class="grain" style="opacity:.08"></div>
  <div class="quote">
    <p>“Biz önce bir optisyeniz, sonra gözlük konusunda <span>bir danışmanız…”</span></p>
    <div class="who label"><span class="rule"></span>Fahri Kuz</div>
  </div>
</div>

<div class="frame" id="f4" hidden>
  <img class="img" src="up/grup.png">
  <div class="shade"></div><div class="grain"></div>
  <div class="title">
    <h1 class="serif">Yarım Asır</h1>
    <div class="bar"></div>
    <div class="ep">BÖLÜM 1</div>
    <div class="next">Hikâye devam ediyor.</div>
  </div>
</div>
<script>
  const f = new URLSearchParams(location.search).get('f') || '1';
  document.getElementById('f' + f).hidden = false;
</script>
</body>
</html>
